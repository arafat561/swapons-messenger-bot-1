<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moderator Inbox &amp; Phone Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: "Hind Siliguri", sans-serif !important;
      font-variant-numeric: tabular-nums;
    }

    body {
      margin: 0;
      background: #07111a;
      color: #e6f1f8;
      padding: 16px;
    }

    @keyframes gentleBobUpDown {
      0%, 100% {
        transform: translateY(-4px);
      }
      50% {
        transform: translateY(3px);
      }
    }

    .card,
    .stat-card,
    .metric-box,
    .option-item,
    .nav-item,
    .ad-account-row,
    .queue-item,
    button,
    [role="button"] {
      transition: transform 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease, border-color 0.22s ease;
    }

    .card:hover,
    .stat-card:hover,
    .metric-box:hover,
    .option-item:hover,
    .nav-item:hover,
    .ad-account-row:hover,
    .queue-item:hover,
    button:hover,
    [role="button"]:hover {
      animation: gentleBobUpDown 1.1s ease-in-out infinite;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      background: #0b1926;
      border: 1px solid #162c40;
      border-radius: 14px;
      padding: 12px 16px;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, select, button, textarea {
      background: #0e2030;
      color: #e6f1f8;
      border: 1px solid #1e3a52;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button.primary {
      background: #10b981;
      color: #04130e;
      border-color: #10b981;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 14px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #0b1926;
      border: 1px solid #162c40;
      border-radius: 14px;
      padding: 14px;
    }

    .queue-item {
      padding: 10px 12px;
      border: 1px solid #183148;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      background: #0d1f30;
    }

    .queue-item.active {
      border-color: #10b981;
      background: #112a3e;
    }

    .chat-box {
      height: 430px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: #07121c;
      border: 1px solid #152b3f;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
    }

    .bubble.customer {
      align-self: flex-start;
      background: #13283c;
      border: 1px solid #1f3d59;
    }

    .bubble.page {
      align-self: flex-end;
      background: #0284c7;
      color: #ffffff;
    }

    .bubble img {
      max-width: 240px;
      border-radius: 8px;
      display: block;
      margin-bottom: 6px;
    }

    .sent-by-meta {
      font-size: 11px;
      color: #e0f2fe;
      opacity: 0.9;
      margin-top: 4px;
      text-align: right;
    }

    .composer {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .composer input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    .preview-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .preview-strip img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #264966;
    }

    .search-results {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-card {
      background: #0d1f30;
      border: 1px solid #19344d;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .muted {
      color: #8fa8bc;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div>
        <strong>Moderator Inbox</strong>
        <div class="muted" id="activeIdentityText">লগইন করে চ্যাট ও নম্বর সার্চ শুরু করুন</div>
      </div>
      <div class="controls">
        <select id="modSelect" class="option-item"></select>
        <input id="modPassInput" type="password" placeholder="Mod Password" value="mod123" />
        <select id="pageFilter" class="option-item" onchange="loadBatch(false)">
          <option value="all">All Pages</option>
          <option value="swapons">Swapons World</option>
          <option value="stone">Stone Rose BD</option>
        </select>
        <button class="primary" onclick="loadBatch(true)">Load Queue</button>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <h4 style="margin:0 0 8px 0;">১১ ডিজিট নম্বর সার্চ</h4>
        <div class="controls">
          <input id="phoneSearchInput" type="text" placeholder="017XXXXXXXX" style="flex:1;" />
          <button class="primary" onclick="searchByPhone()">Search</button>
        </div>
        <div id="phoneSearchResults" class="search-results"></div>

        <hr style="border:0;border-top:1px solid #162c40;margin:14px 0;" />
        <h4 style="margin:0 0 8px 0;">Assigned Queue</h4>
        <div id="queueList"></div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div>
            <strong id="chatCustomerTitle">কোনো চ্যাট সিলেক্ট করা হয়নি</strong>
            <div class="muted" id="chatCustomerMeta"></div>
          </div>
          <button class="nav-item" onclick="refreshCurrentChat()">Refresh Chat</button>
        </div>

        <div id="chatBox" class="chat-box"></div>

        <div id="imagePreviewStrip" class="preview-strip"></div>

        <div class="composer">
          <input id="multiImageInput" type="file" accept="image/*" multiple onchange="handleImagesSelected(event)" />
          <input id="replyTextInput" type="text" placeholder="মেসেজ লিখুন..." onkeydown="if(event.key==='Enter') sendReply()" />
          <button class="primary" id="sendBtn" onclick="sendReply()">Send</button>
        </div>
        <div class="muted" id="sendStatus" style="margin-top:6px;"></div>
      </div>
    </div>
  </div>

  <script>
    let currentChat = null;
    let selectedImagesBase64 = [];

    async function initModerators() {
      const res = await fetch("/api/mod/list");
      const data = await res.json();
      const sel = document.getElementById("modSelect");
      sel.innerHTML = (data.moderators || []).map((m) =>
        `<option value="${m.name}" data-fb="${m.fb_profile}">${m.name} (${m.fb_profile})</option>`
      ).join("");
      updateIdentityBanner();
      sel.addEventListener("change", updateIdentityBanner);
    }

    function updateIdentityBanner() {
      const sel = document.getElementById("modSelect");
      const opt = sel.options[sel.selectedIndex];
      const modName = sel.value || "";
      const fbProfile = opt ? opt.getAttribute("data-fb") : "";
      document.getElementById("activeIdentityText").textContent = modName
        ? `Login: ${modName} • মেসেজের নিচে দেখাবে: Sent by ${fbProfile || modName}`
        : "লগইন করে চ্যাট ও নম্বর সার্চ শুরু করুন";
    }

    function getModHeaders() {
      return {
        "Content-Type": "application/json",
        "x-mod-pass": document.getElementById("modPassInput").value
      };
    }

    async function loadBatch(requestNew) {
      const moderator = document.getElementById("modSelect").value;
      const pageFilter = document.getElementById("pageFilter").value;
      const res = await fetch("/api/mod/batch", {
        method: "POST",
        headers: getModHeaders(),
        body: JSON.stringify({ moderator, requestNew, pageFilter, bucket: "pending" })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "Failed to load queue");
        return;
      }

      const listEl = document.getElementById("queueList");
      const queue = data.queue || [];
      listEl.innerHTML = queue.length
        ? queue.map((item) => `
            <div class="queue-item ${currentChat && currentChat.page_id === item.page_id && currentChat.sender_id === item.sender_id ? "active" : ""}"
                 onclick="openChat('${item.page_id}', '${item.sender_id}', '${escapeHtml(item.customer_name)}', '${escapeHtml(item.page_name)}')">
              <div><strong>${escapeHtml(item.customer_name)}</strong> <span class="muted">(${escapeHtml(item.page_name)})</span></div>
              <div class="muted">${escapeHtml(item.last_message || "")}</div>
            </div>
          `).join("")
        : `<div class="muted">কোনো চ্যাট নেই</div>`;

      if (!currentChat && queue.length > 0) {
        openChat(queue[0].page_id, queue[0].sender_id, queue[0].customer_name, queue[0].page_name);
      }
    }

    async function openChat(pageId, senderId, customerName, pageName) {
      currentChat = { page_id: pageId, sender_id: senderId, customer_name: customerName, page_name: pageName };
      document.getElementById("chatCustomerTitle").textContent = customerName || `Customer_${senderId.slice(-4)}`;
      document.getElementById("chatCustomerMeta").textContent = `${pageName || "Page"} • ID: ${senderId}`;
      await refreshCurrentChat();
    }

    async function refreshCurrentChat() {
      if (!currentChat) return;
      const res = await fetch(
        `/api/mod/chat?page_id=${encodeURIComponent(currentChat.page_id)}&sender_id=${encodeURIComponent(currentChat.sender_id)}`,
        { headers: { "x-mod-pass": document.getElementById("modPassInput").value } }
      );
      const data = await res.json();
      if (!res.ok) return;

      const box = document.getElementById("chatBox");
      const msgs = data.messages || [];
      box.innerHTML = msgs.map((m) => {
        const sentByHtml = m.sender === "page" && m.sent_by_label
          ? `<div class="sent-by-meta">${escapeHtml(m.sent_by_label)}</div>`
          : "";
        return `
          <div class="bubble ${m.sender}">
            ${m.image_url ? `<img src="${m.image_url}" alt="img" />` : ""}
            <div>${escapeHtml(m.text || "")}</div>
            ${m.phone_number ? `<div class="muted">Phone: ${escapeHtml(m.phone_number)}</div>` : ""}
            ${sentByHtml}
          </div>
        `;
      }).join("");
      box.scrollTop = box.scrollHeight;
    }

    function handleImagesSelected(event) {
      const files = Array.from(event.target.files || []);
      selectedImagesBase64 = [];
      const strip = document.getElementById("imagePreviewStrip");
      strip.innerHTML = "";

      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const b64 = e.target.result;
          selectedImagesBase64.push(b64);
          const img = document.createElement("img");
          img.src = b64;
          strip.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }

    async function sendReply() {
      if (!currentChat) {
        alert("আগে একটি চ্যাট সিলেক্ট করুন");
        return;
      }
      const textInput = document.getElementById("replyTextInput");
      const text = textInput.value.trim();
      const moderator = document.getElementById("modSelect").value;

      if (!text && selectedImagesBase64.length === 0) return;

      const sendBtn = document.getElementById("sendBtn");
      sendBtn.disabled = true;
      document.getElementById("sendStatus").textContent = "পাঠানো হচ্ছে...";

      try {
        const res = await fetch("/api/mod/send", {
          method: "POST",
          headers: getModHeaders(),
          body: JSON.stringify({
            page_id: currentChat.page_id,
            sender_id: currentChat.sender_id,
            text,
            imagesBase64: selectedImagesBase64,
            moderator
          })
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById("sendStatus").textContent = data.error || "পাঠানো যায়নি";
        } else {
          textInput.value = "";
          selectedImagesBase64 = [];
          document.getElementById("multiImageInput").value = "";
          document.getElementById("imagePreviewStrip").innerHTML = "";
          document.getElementById("sendStatus").textContent = `পাঠানো হয়েছে (${data.sent_by_label || ""})`;
          await refreshCurrentChat();
        }
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function searchByPhone() {
      const q = document.getElementById("phoneSearchInput").value.trim();
      if (!q) return;

      const res = await fetch(`/api/mod/search-phone?phone=${encodeURIComponent(q)}`, {
        headers: { "x-mod-pass": document.getElementById("modPassInput").value }
      });
      const data = await res.json();
      const out = document.getElementById("phoneSearchResults");

      if (!res.ok) {
        out.innerHTML = `<div class="muted">${escapeHtml(data.error || "Search failed")}</div>`;
        return;
      }

      const matches = data.matches || [];
      out.innerHTML = matches.length
        ? matches.map((m) => `
            <div class="search-card" onclick="openChat('${m.page_id}', '${m.sender_id}', '${escapeHtml(m.customer_name)}', '${escapeHtml(m.page_name)}')">
              <div><strong>${escapeHtml(m.phone_number || q)}</strong> • ${escapeHtml(m.customer_name)}</div>
              <div class="muted">First Owner: ${escapeHtml(m.first_owner_fb_profile || "N/A")}</div>
              <div class="muted">Sent by IDs: ${escapeHtml(m.sent_by_fb_profiles || "N/A")}</div>
            </div>
          `).join("")
        : `<div class="muted">এই নম্বরে কোনো চ্যাট পাওয়া যায়নি</div>`;
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    initModerators();
  </script>
</body>
</html>
